apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-ksops-cmp
  namespace: argocd
data:
  plugin.yaml: |
    apiVersion: argoproj.io/v1alpha1
    kind: ConfigManagementPlugin
    metadata:
      name: ksops
    spec:
      # Do not configure discovery. Argo CD transfers an application archive to
      # a CMP before it can evaluate discovery, which made non-secret overlays
      # contend with encrypted workloads. Encrypted Applications select this
      # plugin explicitly via spec.source.plugin.name: ksops.
      generate:
        command:
          - /usr/local/bin/kustomize
          - build
          - --enable-alpha-plugins
          - --enable-exec
          - .
