apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/vucongthanh92/courier-common.git
    targetRevision: main
    path: k8s/overlays/dev/traefik
    plugin:
      name: ksops
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
