apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: flikk-app-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/vucongthanh92/courier-common.git
    targetRevision: main
    path: k8s/overlays/dev/flikk-app
  destination:
    server: https://kubernetes.default.svc
    namespace: courier-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
