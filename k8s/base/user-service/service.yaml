apiVersion: v1
kind: Service
metadata:
  name: user-service
  labels:
    observability.courier.io/metrics: "true"
spec:
  selector:
    app: user-service
  ports:
    - name: http
      port: 5001
      targetPort: http
    - name: grpc
      port: 6001
      targetPort: grpc
    - name: metrics
      port: 8001
      targetPort: metrics
  type: ClusterIP
