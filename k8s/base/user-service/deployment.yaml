apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
        observability.courier.io/logs: "true"
      annotations:
        reloader.stakater.com/auto: "true"
    spec:
      initContainers:
        - name: render-runtime-config
          image: mikefarah/yq:4.45.1
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-ec"]
          args:
            - |
              yq '(.. | select(tag == "!!str")) |= envsubst(nu,ne,ff)' /sso-overlay/sso.yaml > /rendered/sso.yaml
              yq eval-all 'select(fileIndex == 0) * select(fileIndex == 1)' /config-template/config.yaml /rendered/sso.yaml > /rendered/config.yaml
              test -s /rendered/config.yaml
          envFrom:
            - secretRef:
                name: user-service-runtime-secrets
          volumeMounts:
            - name: config-template
              mountPath: /config-template
              readOnly: true
            - name: sso-overlay
              mountPath: /sso-overlay
              readOnly: true
            - name: rendered-config
              mountPath: /rendered
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
      containers:
        - name: user-service
          image: ghcr.io/vucongthanh92/courier/user-service:dev
          imagePullPolicy: IfNotPresent
          command: ["/app/user-service"]
          args: ["start", "--config=/app/config/dev/config.yaml"]
          envFrom:
            - configMapRef:
                name: user-service-runtime
            - secretRef:
                name: user-service-runtime-secrets
                optional: true
          ports:
            - name: http
              containerPort: 5001
            - name: grpc
              containerPort: 6001
            - name: health
              containerPort: 7001
            - name: metrics
              containerPort: 8001
          volumeMounts:
            - name: rendered-config
              mountPath: /app/config/dev/config.yaml
              subPath: config.yaml
              readOnly: true
          startupProbe:
            httpGet:
              path: /live
              port: health
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /ready
              port: health
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /live
              port: health
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: config-template
          secret:
            secretName: user-service-config
        - name: sso-overlay
          configMap:
            name: user-service-sso-overlay
        - name: rendered-config
          emptyDir: {}
