apiVersion: v1
kind: Service
metadata:
  name: chat-service
  labels:
    observability.courier.io/metrics: "true"
spec:
  type: ClusterIP
  selector:
    app: chat-service
  ports:
    - name: http
      port: 5002
      targetPort: http
    - name: grpc
      port: 6002
      targetPort: grpc
    - name: metrics
      port: 8002
      targetPort: metrics
