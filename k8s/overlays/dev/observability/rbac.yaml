apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: alloy
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: prometheus-discovery
  namespace: courier-dev
rules:
  - apiGroups: [""]
    resources: ["services", "endpoints", "pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: prometheus-discovery
  namespace: courier-dev
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: courier-observability
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: prometheus-discovery
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: alloy-log-reader
  namespace: courier-dev
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: alloy-log-reader
  namespace: courier-dev
subjects:
  - kind: ServiceAccount
    name: alloy
    namespace: courier-observability
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: alloy-log-reader
