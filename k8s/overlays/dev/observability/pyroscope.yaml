apiVersion: v1
kind: ConfigMap
metadata:
  name: pyroscope-config
  namespace: courier-observability
data:
  config.yaml: |
    # Single-node storage is intentional for the cost-constrained dev cluster.
    # It must not be reused for a production multi-node deployment.
    target: all
    server:
      log_level: warn
    limits:
      retention_period: 3d
    storage:
      backend: filesystem
      filesystem:
        dir: /data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pyroscope-data
  namespace: courier-observability
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pyroscope
  namespace: courier-observability
  labels:
    app: pyroscope
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pyroscope
  template:
    metadata:
      labels:
        app: pyroscope
    spec:
      containers:
        - name: pyroscope
          image: grafana/pyroscope:2.4.3
          args:
            - -config.file=/etc/pyroscope/config.yaml
          ports:
            - name: http
              containerPort: 4040
          readinessProbe:
            httpGet:
              path: /ready
              port: http
          startupProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /ready
              port: http
          resources:
            # Provisional sizing: validate against Application EC2 after profiles arrive.
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi
          volumeMounts:
            - name: config
              mountPath: /etc/pyroscope
              readOnly: true
            - name: data
              mountPath: /data
      volumes:
        - name: config
          configMap:
            name: pyroscope-config
        - name: data
          persistentVolumeClaim:
            claimName: pyroscope-data
---
apiVersion: v1
kind: Service
metadata:
  name: pyroscope
  namespace: courier-observability
spec:
  type: ClusterIP
  selector:
    app: pyroscope
  ports:
    - name: http
      port: 4040
      targetPort: http
