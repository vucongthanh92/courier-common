apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: courier-parameter-store
spec:
  provider:
    aws:
      service: ParameterStore
      region: ap-southeast-2
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: logging-dashboard-credentials
spec:
  refreshPolicy: Periodic
  refreshInterval: 15m
  secretStoreRef:
    kind: SecretStore
    name: courier-parameter-store
  target:
    name: logging-dashboard-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: users
      remoteRef:
        key: /courier/dev/admin-logging/runtime/BASIC_AUTH_USERS
    - secretKey: admin-password
      remoteRef:
        key: /courier/dev/admin-logging/runtime/GRAFANA_ADMIN_PASSWORD
