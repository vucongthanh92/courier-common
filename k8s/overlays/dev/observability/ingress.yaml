apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: logging-dashboard-auth
  namespace: courier-observability
spec:
  basicAuth:
    secret: logging-dashboard-basic-auth
    removeHeader: true
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: logging-dashboard
  namespace: courier-observability
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`courier.io.vn`) && PathPrefix(`/admin/logging`)
      kind: Rule
      middlewares:
        - name: logging-dashboard-auth
      services:
        - name: grafana
          port: 80
  tls:
    certResolver: letsencrypt
