apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: argocd-dashboard
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`courier.io.vn`) && PathPrefix(`/admin/argocd`)
      priority: 350
      middlewares:
        - name: argocd-admin-basic-auth
      services:
        - name: argocd-server
          port: 80
  tls:
    certResolver: letsencrypt
