apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-admin-basic-auth
spec:
  refreshPolicy: Periodic
  refreshInterval: 15m
  secretStoreRef:
    kind: SecretStore
    name: courier-parameter-store
  target:
    name: argocd-admin-basic-auth
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: users
      remoteRef:
        key: /courier/dev/admin-argocd/runtime/BASIC_AUTH_USERS
