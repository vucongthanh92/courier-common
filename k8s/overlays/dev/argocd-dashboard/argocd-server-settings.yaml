apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cmd-params-cm
  annotations:
    argocd.argoproj.io/sync-options: ServerSideApply=true
data:
  server.insecure: "true"
  server.basehref: /admin/argocd
  server.rootpath: /admin/argocd
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-server
  annotations:
    argocd.argoproj.io/sync-options: ServerSideApply=true
spec:
  template:
    metadata:
      annotations:
        # Forces the first rollout when the subpath settings are introduced.
        courier.io/argocd-public-path: v1
        # Future changes to argocd-cmd-params-cm are rolled out automatically.
        reloader.stakater.com/auto: "true"
